<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Controles del espejo</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * { box-sizing: border-box; }

    html,
    body {
      width: 100%;
      height: 100%;
      min-height: 100%;
      margin: 0;
      overflow: hidden;
      background: #05080b;
      touch-action: manipulation;
      user-select: none;
      -webkit-user-select: none;
    }

    #controles {
      --margen: clamp(14px, 3vmin, 28px);
      --separacion: clamp(10px, 2.4vmin, 42px);
      display: grid;
      grid-template-rows: clamp(88px, 20dvh, 150px) minmax(0, 1fr);
      gap: var(--separacion);
      width: 100%;
      height: 100vh;
      height: 100svh;
      height: 100dvh;
      min-height: 100%;
      padding:
        max(var(--margen), env(safe-area-inset-top))
        max(var(--margen), env(safe-area-inset-right))
        max(var(--margen), env(safe-area-inset-bottom))
        max(var(--margen), env(safe-area-inset-left));
      view-transition-name: panel-controles;
    }

    #controles.sin-acciones {
      grid-template-rows: 1fr;
    }

    #controles:empty::after {
      content: '';
      width: 18px;
      height: 18px;
      place-self: center;
      border-radius: 50%;
      background: #26313a;
      box-shadow: 0 0 28px rgba(98, 216, 255, 0.16);
      animation: espera-controles 1.6s ease-in-out infinite;
    }

    .estado,
    .acciones {
      min-width: 0;
      min-height: 0;
    }

    .estado {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: clamp(12px, 2vmin, 24px);
      overflow: hidden;
      padding: clamp(10px, 2vmin, 22px);
      border: 1px solid #2b363e;
      border-radius: clamp(14px, 3vmin, 30px);
      color: #f7fbfd;
      background: #10161a;
      box-shadow:
        0 16px 54px rgba(0, 0, 0, 0.34),
        inset 0 0 42px color-mix(in srgb, var(--color-carrera, #62d8ff) 8%, transparent);
      animation: entrar-estado 440ms cubic-bezier(.16, .8, .24, 1) both;
    }

    .estado::before {
      content: '';
      position: absolute;
      inset: 0;
      border-left: 5px solid var(--color-carrera, #62d8ff);
      opacity: 0.8;
      pointer-events: none;
    }

    .estado p {
      max-width: 28ch;
      margin: 0;
      font-size: 1.35rem;
      font-weight: 760;
      line-height: 1.15;
      letter-spacing: 0;
      text-align: center;
      text-wrap: balance;
    }

    .estado-sorteo {
      --color-carrera: #62d8ff;
    }

    .estado-sorteo::after {
      content: '';
      position: absolute;
      left: 0;
      bottom: 0;
      width: 100%;
      height: 5px;
      background: #62d8ff;
      transform: scaleX(0);
      transform-origin: left;
      animation: avance-sorteo var(--duracion-sorteo, 8000ms) linear forwards;
    }

    .indicador-sorteo {
      --duracion-sorteo: 8000ms;
      position: relative;
      flex: 0 0 auto;
      width: clamp(50px, 8vmin, 78px);
      aspect-ratio: 1;
      border: clamp(5px, 0.8vmin, 8px) solid #27343c;
      border-top-color: #62d8ff;
      border-right-color: #b2efff;
      border-radius: 50%;
      filter: drop-shadow(0 0 14px rgba(98, 216, 255, 0.26));
      animation: girar-carga 1.1s linear infinite;
    }

    .indicador-sorteo span {
      position: absolute;
      inset: 27%;
      border-radius: 50%;
      background: #62d8ff;
      box-shadow: 0 0 20px rgba(98, 216, 255, 0.55);
      animation: respirar-carga 1.1s ease-in-out infinite;
    }

    .simbolo-carrera {
      flex: 0 1 auto;
      display: grid;
      place-items: center;
      width: min(13vmin, 108px);
      height: min(11vmin, 88px);
      min-width: 62px;
      border: 1px solid color-mix(in srgb, var(--color-carrera) 58%, #ffffff);
      border-radius: 8px;
      color: var(--color-carrera);
      background: color-mix(in srgb, var(--color-carrera) 12%, #10161a);
      font-family: ui-monospace, "SFMono-Regular", Consolas, monospace;
      font-size: 2rem;
      font-weight: 800;
      line-height: 1;
      letter-spacing: 0;
      filter:
        drop-shadow(0 10px 16px rgba(0, 0, 0, 0.42))
        drop-shadow(0 0 14px color-mix(in srgb, var(--color-carrera) 35%, transparent));
      animation: aparecer-simbolo 580ms 100ms cubic-bezier(.16, .8, .24, 1.15) both;
    }

    .resultado-carrera {
      display: grid;
      gap: 6px;
      min-width: 0;
      max-width: 34rem;
    }

    .resultado-carrera span {
      color: #aebac1;
      font-size: 0.78rem;
      font-weight: 750;
      line-height: 1.1;
      letter-spacing: 0;
      text-transform: uppercase;
    }

    .resultado-carrera strong {
      color: var(--color-carrera);
      font-size: 1.5rem;
      line-height: 1.05;
      letter-spacing: 0;
      text-wrap: balance;
    }

    .acciones {
      display: grid;
      grid-template-columns: repeat(var(--cantidad), minmax(0, 1fr));
      gap: var(--separacion);
    }

    .acciones.sin-controles {
      display: none;
    }

    .control {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      min-width: 0;
      min-height: 0;
      border: 3px solid color-mix(in srgb, var(--color) 72%, white);
      border-radius: clamp(18px, 5vmin, 64px);
      padding: clamp(14px, 4vmin, 56px);
      color: #fff;
      background:
        radial-gradient(circle at 50% 24%, color-mix(in srgb, var(--color) 28%, transparent), transparent 52%),
        linear-gradient(145deg, #141c22, #080c10);
      box-shadow:
        0 22px 70px rgba(0, 0, 0, 0.52),
        inset 0 0 50px color-mix(in srgb, var(--color) 10%, transparent);
      container-type: size;
      font-family: inherit;
      font-size: clamp(1.25rem, min(12cqh, 8cqw), 4.5rem);
      font-weight: 800;
      line-height: 1.05;
      letter-spacing: 0;
      text-align: center;
      text-wrap: balance;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      overflow: hidden;
      transform: translateY(0) scale(1);
      animation: aparecer-control 360ms cubic-bezier(.2, .9, .2, 1.1) both;
      animation-delay: calc(var(--indice) * 54ms);
      transition:
        transform 160ms cubic-bezier(.2, .9, .2, 1),
        filter 160ms ease,
        box-shadow 160ms ease;
    }

    .control > span {
      position: relative;
      z-index: 1;
      max-width: 100%;
    }

    .control::before {
      content: '';
      position: absolute;
      inset: -30%;
      background:
        radial-gradient(circle at 50% 50%, color-mix(in srgb, var(--color) 28%, transparent), transparent 36%);
      opacity: 0;
      transform: scale(0.4);
      pointer-events: none;
    }

    .control::after {
      content: '';
      position: absolute;
      inset: 12px;
      border-radius: inherit;
      border: 1px solid color-mix(in srgb, var(--color) 34%, transparent);
      pointer-events: none;
    }

    .control:hover {
      transform: translateY(-2px) scale(1.01);
      filter: brightness(1.08);
      box-shadow:
        0 26px 78px rgba(0, 0, 0, 0.56),
        inset 0 0 64px color-mix(in srgb, var(--color) 14%, transparent);
    }

    .control:active {
      transform: translateY(2px) scale(0.975);
      filter: brightness(1.3);
      box-shadow:
        0 10px 34px rgba(0, 0, 0, 0.56),
        inset 0 0 90px color-mix(in srgb, var(--color) 22%, transparent);
    }

    .control.pulsado::before {
      animation: pulso-control 420ms ease-out;
    }

    .control:focus-visible {
      outline: 5px solid #fff;
      outline-offset: -10px;
    }

    #conexion {
      position: fixed;
      right: max(14px, env(safe-area-inset-right));
      top: max(14px, env(safe-area-inset-top));
      width: 12px;
      height: 12px;
      z-index: 2;
      border-radius: 50%;
      background: #ff5577;
      box-shadow: 0 0 18px currentColor;
      pointer-events: none;
    }

    #conexion.conectada {
      color: #7cffb2;
      background: currentColor;
    }

    @keyframes aparecer-control {
      from {
        opacity: 0;
        transform: translateY(18px) scale(0.94);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    @keyframes pulso-control {
      0% {
        opacity: 0.7;
        transform: scale(0.35);
      }
      100% {
        opacity: 0;
        transform: scale(1.15);
      }
    }

    @keyframes espera-controles {
      0%,
      100% {
        opacity: 0.38;
        transform: scale(0.85);
      }
      50% {
        opacity: 1;
        transform: scale(1);
      }
    }

    @keyframes entrar-estado {
      from {
        opacity: 0;
        transform: translateX(18px);
      }
      to {
        opacity: 1;
        transform: translateX(0);
      }
    }

    @keyframes aparecer-simbolo {
      from {
        opacity: 0;
        transform: scale(0.72) rotate(-6deg);
      }
      to {
        opacity: 1;
        transform: scale(1) rotate(0);
      }
    }

    @keyframes girar-carga {
      to { transform: rotate(360deg); }
    }

    @keyframes respirar-carga {
      0%,
      100% { transform: scale(0.72); opacity: 0.55; }
      50% { transform: scale(1); opacity: 1; }
    }

    @keyframes avance-sorteo {
      to { transform: scaleX(1); }
    }

    @keyframes salir-vista {
      to {
        opacity: 0;
        transform: translateX(-24px) scale(0.985);
      }
    }

    @keyframes entrar-vista {
      from {
        opacity: 0;
        transform: translateX(24px) scale(0.985);
      }
    }

    ::view-transition-old(panel-controles) {
      animation: 220ms ease-in both salir-vista;
    }

    ::view-transition-new(panel-controles) {
      animation: 380ms cubic-bezier(.16, .8, .24, 1) both entrar-vista;
    }

    @media (orientation: portrait) {
      .acciones {
        grid-template-columns: 1fr;
        grid-template-rows: repeat(var(--cantidad), minmax(0, 1fr));
      }
    }

    @media (max-width: 640px) {
      #controles {
        --margen: clamp(10px, 3.2vmin, 16px);
        --separacion: clamp(8px, 2.6vmin, 14px);
        grid-template-rows: clamp(92px, 17dvh, 124px) minmax(0, 1fr);
      }

      #controles.sin-acciones {
        grid-template-rows: 1fr;
      }

      .estado {
        gap: 10px;
        padding: 9px 14px;
        border-radius: 18px;
      }

      .estado p {
        font-size: 1.08rem;
      }

      .simbolo-carrera {
        width: 68px;
        height: 60px;
        min-width: 54px;
        font-size: 1.45rem;
      }

      .resultado-carrera span {
        font-size: 0.66rem;
      }

      .resultado-carrera strong {
        font-size: 1.05rem;
      }

      .control {
        border-width: 2px;
        border-radius: clamp(16px, 5.5vmin, 28px);
        padding: clamp(10px, 3.8vmin, 20px);
        box-shadow:
          0 12px 36px rgba(0, 0, 0, 0.48),
          inset 0 0 34px color-mix(in srgb, var(--color) 10%, transparent);
        font-size: clamp(1.08rem, min(11cqh, 7cqw), 2.65rem);
      }

      .acciones[data-cantidad="3"] .control,
      .acciones[data-cantidad="4"] .control {
        font-size: clamp(1rem, min(9.5cqh, 7.2cqw), 2.6rem);
      }

      .control::after {
        inset: 7px;
      }

      #conexion {
        right: max(9px, env(safe-area-inset-right));
        top: max(9px, env(safe-area-inset-top));
        width: 10px;
        height: 10px;
      }
    }

    @media (max-width: 640px) and (orientation: landscape) {
      .acciones {
        grid-template-columns: repeat(var(--cantidad), minmax(84px, 1fr));
      }

      .control {
        font-size: clamp(1.05rem, min(16cqh, 7cqw), 2.5rem);
      }
    }

    @media (max-height: 480px) and (orientation: landscape) {
      #controles {
        --margen: clamp(8px, 2.6vmin, 14px);
        --separacion: clamp(8px, 2.2vmin, 14px);
        grid-template-rows: clamp(70px, 23dvh, 88px) minmax(0, 1fr);
      }

      #controles.sin-acciones {
        grid-template-rows: 1fr;
      }

      .estado {
        padding-block: 8px;
      }

      .estado p {
        font-size: 0.95rem;
      }

      .simbolo-carrera {
        width: 58px;
        height: 48px;
        font-size: 1.25rem;
      }

      .resultado-carrera strong {
        font-size: 0.95rem;
      }

      .control {
        border-radius: clamp(14px, 4vmin, 24px);
        padding: clamp(8px, 2.8vmin, 16px);
        font-size: clamp(1.2rem, 3.35vw, 2.2rem);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      #controles:empty::after,
      .estado,
      .estado-sorteo::after,
      .indicador-sorteo,
      .indicador-sorteo span,
      .simbolo-carrera,
      .control,
      .control.pulsado::before {
        animation: none;
      }

      .control { transition: none; }

      ::view-transition-old(panel-controles),
      ::view-transition-new(panel-controles) {
        animation: none;
      }
    }
  </style>
</head>
<body>
  <main id="controles" class="sin-controles" aria-live="polite"></main>
  <div id="conexion" role="status" aria-label="Sin conexión"></div>

  <script type="module">
    import { crearBus } from '/espejo/bus.js';
    import { CONFIG } from '/espejo/config.js';
    import { crearPantallaDeControles, crearTabletDeControles } from '/tablet/controles.js';

    const contenedor = document.getElementById('controles');
    const conexion = document.getElementById('conexion');
    let carreras = new Map();
    try {
      const respuesta = await fetch('/assets/carreras.json');
      if (!respuesta.ok) throw new Error(`HTTP ${respuesta.status}`);
      carreras = new Map(
        (await respuesta.json()).carreras.map((carrera) => [carrera.id, carrera]),
      );
    } catch (error) {
      console.warn('No se pudieron cargar los símbolos de las carreras:', error);
    }
    const pantalla = crearPantallaDeControles({
      contenedor,
      duracionSorteoMs: CONFIG.tiempos.sorteo,
    });
    let bus = null;
    const tablet = crearTabletDeControles({
      pantalla,
      obtenerCarrera: (id) => carreras.get(id) ?? null,
      enviar: (mensaje) => bus?.enviar(mensaje) ?? false,
    });

    bus = crearBus({
      url: `ws://${location.hostname}:${location.port || 8080}`,
      reconexionMs: 2000,
      alMensaje: (mensaje) => tablet.recibir(mensaje),
      alEstado: ({ conectado }) => {
        conexion.classList.toggle('conectada', conectado);
        conexion.setAttribute('aria-label', conectado ? 'Conectada' : 'Sin conexión');
      },
    });
  </script>
</body>
</html>
