<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Controles del espejo</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * { box-sizing: border-box; }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #05080b;
      touch-action: manipulation;
      user-select: none;
      -webkit-user-select: none;
    }

    #controles {
      --cantidad: 1;
      display: grid;
      grid-template-columns: repeat(var(--cantidad), minmax(0, 1fr));
      gap: clamp(18px, 3vw, 42px);
      width: 100%;
      height: 100%;
      padding:
        max(28px, env(safe-area-inset-top))
        max(28px, env(safe-area-inset-right))
        max(28px, env(safe-area-inset-bottom))
        max(28px, env(safe-area-inset-left));
    }

    #controles.sin-controles::after {
      content: '';
      width: 18px;
      height: 18px;
      place-self: center;
      border-radius: 50%;
      background: #26313a;
      box-shadow: 0 0 28px rgba(98, 216, 255, 0.16);
    }

    .control {
      position: relative;
      min-width: 0;
      border: 3px solid color-mix(in srgb, var(--color) 72%, white);
      border-radius: clamp(28px, 5vw, 64px);
      padding: 5vw;
      color: #fff;
      background:
        radial-gradient(circle at 50% 24%, color-mix(in srgb, var(--color) 28%, transparent), transparent 52%),
        linear-gradient(145deg, #141c22, #080c10);
      box-shadow:
        0 22px 70px rgba(0, 0, 0, 0.52),
        inset 0 0 50px color-mix(in srgb, var(--color) 10%, transparent);
      font-family: inherit;
      font-size: clamp(38px, 7vw, 88px);
      font-weight: 800;
      line-height: 1.05;
      letter-spacing: -0.035em;
      text-wrap: balance;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      transition: transform 100ms ease, filter 100ms ease, box-shadow 100ms ease;
    }

    .control::after {
      content: '';
      position: absolute;
      inset: 12px;
      border-radius: inherit;
      border: 1px solid color-mix(in srgb, var(--color) 34%, transparent);
      pointer-events: none;
    }

    .control:active {
      transform: scale(0.975);
      filter: brightness(1.3);
      box-shadow:
        0 10px 34px rgba(0, 0, 0, 0.56),
        inset 0 0 90px color-mix(in srgb, var(--color) 22%, transparent);
    }

    .control:focus-visible {
      outline: 5px solid #fff;
      outline-offset: -10px;
    }

    #conexion {
      position: fixed;
      right: max(14px, env(safe-area-inset-right));
      top: max(14px, env(safe-area-inset-top));
      width: 12px;
      height: 12px;
      z-index: 2;
      border-radius: 50%;
      background: #ff5577;
      box-shadow: 0 0 18px currentColor;
      pointer-events: none;
    }

    #conexion.conectada {
      color: #7cffb2;
      background: currentColor;
    }

    @media (orientation: portrait) {
      #controles {
        grid-template-columns: 1fr;
        grid-template-rows: repeat(var(--cantidad), minmax(0, 1fr));
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .control { transition: none; }
    }
  </style>
</head>
<body>
  <main id="controles" class="sin-controles" aria-live="polite"></main>
  <div id="conexion" role="status" aria-label="Sin conexión"></div>

  <script type="module">
    import { crearBus } from '../espejo/bus.js';
    import { crearPantallaDeControles, crearTabletDeControles } from './controles.js';

    const contenedor = document.getElementById('controles');
    const conexion = document.getElementById('conexion');
    const pantalla = crearPantallaDeControles({ contenedor });
    let bus = null;
    const tablet = crearTabletDeControles({
      pantalla,
      enviar: (mensaje) => bus?.enviar(mensaje) ?? false,
    });

    bus = crearBus({
      url: `ws://${location.hostname}:${location.port || 8080}`,
      reconexionMs: 2000,
      alMensaje: (mensaje) => tablet.recibir(mensaje),
      alEstado: ({ conectado }) => {
        conexion.classList.toggle('conectada', conectado);
        conexion.setAttribute('aria-label', conectado ? 'Conectada' : 'Sin conexión');
      },
    });
  </script>
</body>
</html>
