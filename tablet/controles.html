<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Controles del espejo</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * { box-sizing: border-box; }

    html,
    body {
      width: 100%;
      height: 100%;
      min-height: 100%;
      margin: 0;
      overflow: hidden;
      background: #05080b;
      touch-action: manipulation;
      user-select: none;
      -webkit-user-select: none;
    }

    #controles {
      --cantidad: 1;
      --margen: clamp(14px, 3vmin, 28px);
      --separacion: clamp(10px, 2.4vmin, 42px);
      display: grid;
      grid-template-columns: repeat(var(--cantidad), minmax(0, 1fr));
      gap: var(--separacion);
      width: 100%;
      height: 100vh;
      height: 100svh;
      height: 100dvh;
      min-height: 100%;
      padding:
        max(var(--margen), env(safe-area-inset-top))
        max(var(--margen), env(safe-area-inset-right))
        max(var(--margen), env(safe-area-inset-bottom))
        max(var(--margen), env(safe-area-inset-left));
    }

    #controles.sin-controles::after {
      content: '';
      width: 18px;
      height: 18px;
      place-self: center;
      border-radius: 50%;
      background: #26313a;
      box-shadow: 0 0 28px rgba(98, 216, 255, 0.16);
      animation: espera-controles 1.6s ease-in-out infinite;
    }

    .control {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      min-width: 0;
      min-height: 0;
      border: 3px solid color-mix(in srgb, var(--color) 72%, white);
      border-radius: clamp(18px, 5vmin, 64px);
      padding: clamp(14px, 4vmin, 56px);
      color: #fff;
      background:
        radial-gradient(circle at 50% 24%, color-mix(in srgb, var(--color) 28%, transparent), transparent 52%),
        linear-gradient(145deg, #141c22, #080c10);
      box-shadow:
        0 22px 70px rgba(0, 0, 0, 0.52),
        inset 0 0 50px color-mix(in srgb, var(--color) 10%, transparent);
      container-type: size;
      font-family: inherit;
      font-size: clamp(1.35rem, min(12cqh, 9cqw), 5.5rem);
      font-weight: 800;
      line-height: 1.05;
      letter-spacing: 0;
      text-align: center;
      text-wrap: balance;
      overflow-wrap: anywhere;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      overflow: hidden;
      transform: translateY(0) scale(1);
      animation: aparecer-control 360ms cubic-bezier(.2, .9, .2, 1.1) both;
      animation-delay: calc(var(--indice) * 54ms);
      transition:
        transform 160ms cubic-bezier(.2, .9, .2, 1),
        filter 160ms ease,
        box-shadow 160ms ease;
    }

    .control::before {
      content: '';
      position: absolute;
      inset: -30%;
      background:
        radial-gradient(circle at 50% 50%, color-mix(in srgb, var(--color) 28%, transparent), transparent 36%);
      opacity: 0;
      transform: scale(0.4);
      pointer-events: none;
    }

    .control::after {
      content: '';
      position: absolute;
      inset: 12px;
      border-radius: inherit;
      border: 1px solid color-mix(in srgb, var(--color) 34%, transparent);
      pointer-events: none;
    }

    .control:hover {
      transform: translateY(-2px) scale(1.01);
      filter: brightness(1.08);
      box-shadow:
        0 26px 78px rgba(0, 0, 0, 0.56),
        inset 0 0 64px color-mix(in srgb, var(--color) 14%, transparent);
    }

    .control:active {
      transform: translateY(2px) scale(0.975);
      filter: brightness(1.3);
      box-shadow:
        0 10px 34px rgba(0, 0, 0, 0.56),
        inset 0 0 90px color-mix(in srgb, var(--color) 22%, transparent);
    }

    .control.pulsado::before {
      animation: pulso-control 420ms ease-out;
    }

    .control:focus-visible {
      outline: 5px solid #fff;
      outline-offset: -10px;
    }

    #conexion {
      position: fixed;
      right: max(14px, env(safe-area-inset-right));
      top: max(14px, env(safe-area-inset-top));
      width: 12px;
      height: 12px;
      z-index: 2;
      border-radius: 50%;
      background: #ff5577;
      box-shadow: 0 0 18px currentColor;
      pointer-events: none;
    }

    #conexion.conectada {
      color: #7cffb2;
      background: currentColor;
    }

    @keyframes aparecer-control {
      from {
        opacity: 0;
        transform: translateY(18px) scale(0.94);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    @keyframes pulso-control {
      0% {
        opacity: 0.7;
        transform: scale(0.35);
      }
      100% {
        opacity: 0;
        transform: scale(1.15);
      }
    }

    @keyframes espera-controles {
      0%,
      100% {
        opacity: 0.38;
        transform: scale(0.85);
      }
      50% {
        opacity: 1;
        transform: scale(1);
      }
    }

    @media (orientation: portrait) {
      #controles {
        grid-template-columns: 1fr;
        grid-template-rows: repeat(var(--cantidad), minmax(0, 1fr));
      }
    }

    @media (max-width: 640px) {
      #controles {
        --margen: clamp(10px, 3.2vmin, 16px);
        --separacion: clamp(8px, 2.6vmin, 14px);
      }

      .control {
        border-width: 2px;
        border-radius: clamp(16px, 5.5vmin, 28px);
        padding: clamp(10px, 3.8vmin, 20px);
        box-shadow:
          0 12px 36px rgba(0, 0, 0, 0.48),
          inset 0 0 34px color-mix(in srgb, var(--color) 10%, transparent);
        font-size: clamp(1.2rem, min(11cqh, 8cqw), 3rem);
      }

      #controles[data-cantidad="3"] .control,
      #controles[data-cantidad="4"] .control {
        font-size: clamp(1rem, min(9.5cqh, 7.2cqw), 2.6rem);
      }

      .control::after {
        inset: 7px;
      }

      #conexion {
        right: max(9px, env(safe-area-inset-right));
        top: max(9px, env(safe-area-inset-top));
        width: 10px;
        height: 10px;
      }
    }

    @media (max-width: 640px) and (orientation: landscape) {
      #controles {
        grid-template-columns: repeat(var(--cantidad), minmax(84px, 1fr));
      }

      .control {
        font-size: clamp(1.05rem, min(16cqh, 7cqw), 2.5rem);
      }
    }

    @media (max-height: 480px) and (orientation: landscape) {
      #controles {
        --margen: clamp(8px, 2.6vmin, 14px);
        --separacion: clamp(8px, 2.2vmin, 14px);
      }

      .control {
        border-radius: clamp(14px, 4vmin, 24px);
        padding: clamp(8px, 2.8vmin, 16px);
        font-size: clamp(1.25rem, 3.8vw, 2.35rem);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      #controles.sin-controles::after,
      .control,
      .control.pulsado::before {
        animation: none;
      }

      .control { transition: none; }
    }
  </style>
</head>
<body>
  <main id="controles" class="sin-controles" aria-live="polite"></main>
  <div id="conexion" role="status" aria-label="Sin conexión"></div>

  <script type="module">
    import { crearBus } from '/espejo/bus.js';
    import { crearPantallaDeControles, crearTabletDeControles } from '/tablet/controles.js';

    const contenedor = document.getElementById('controles');
    const conexion = document.getElementById('conexion');
    const pantalla = crearPantallaDeControles({ contenedor });
    let bus = null;
    const tablet = crearTabletDeControles({
      pantalla,
      enviar: (mensaje) => bus?.enviar(mensaje) ?? false,
    });

    bus = crearBus({
      url: `ws://${location.hostname}:${location.port || 8080}`,
      reconexionMs: 2000,
      alMensaje: (mensaje) => tablet.recibir(mensaje),
      alEstado: ({ conectado }) => {
        conexion.classList.toggle('conectada', conectado);
        conexion.setAttribute('aria-label', conectado ? 'Conectada' : 'Sin conexión');
      },
    });
  </script>
</body>
</html>
