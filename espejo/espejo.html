<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <base href="/espejo/">
  <title>Espejo Mágico</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
    button, select, input { font: inherit; }
    canvas { display: block; width: 100vw; height: 100vh; }

    .boton-configuracion {
      position: fixed;
      top: max(20px, env(safe-area-inset-top));
      right: max(20px, env(safe-area-inset-right));
      z-index: 18;
      display: grid;
      width: 54px;
      height: 54px;
      padding: 0;
      place-items: center;
      color: rgba(255, 255, 255, 0.92);
      background: rgba(16, 20, 24, 0.62);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 50%;
      box-shadow: 0 10px 32px rgba(0, 0, 0, 0.24);
      backdrop-filter: blur(14px);
      cursor: pointer;
      opacity: 0.72;
      transition: opacity 160ms ease, transform 220ms ease, background 160ms ease;
    }
    .boton-configuracion:hover,
    .boton-configuracion:focus-visible {
      color: #fff;
      background: rgba(25, 31, 37, 0.88);
      opacity: 1;
      transform: scale(1.05);
    }
    .boton-configuracion:focus-visible,
    .boton-cerrar:focus-visible,
    .boton-recargar:focus-visible,
    select:focus-visible,
    .interruptor input:focus-visible + .pista {
      outline: 3px solid rgba(116, 210, 255, 0.72);
      outline-offset: 3px;
    }
    .boton-configuracion img {
      width: 25px;
      height: 25px;
      transition: transform 350ms ease;
    }
    .configuracion-abierta .boton-configuracion img { transform: rotate(55deg); }

    .fondo-configuracion {
      position: fixed;
      inset: 0;
      z-index: 19;
      background: rgba(0, 0, 0, 0.42);
      opacity: 0;
      pointer-events: none;
      transition: opacity 240ms ease;
    }
    .panel-configuracion {
      position: fixed;
      top: 16px;
      right: 16px;
      bottom: 16px;
      z-index: 20;
      display: flex;
      width: min(390px, calc(100vw - 32px));
      padding: 26px;
      flex-direction: column;
      gap: 24px;
      color: #f4f7f9;
      background:
        radial-gradient(circle at 100% 0%, rgba(67, 151, 194, 0.18), transparent 36%),
        rgba(15, 19, 23, 0.95);
      border: 1px solid rgba(255, 255, 255, 0.13);
      border-radius: 24px;
      box-shadow: -20px 0 70px rgba(0, 0, 0, 0.44);
      backdrop-filter: blur(24px);
      opacity: 0;
      overflow-y: auto;
      pointer-events: none;
      transform: translateX(calc(100% + 32px));
      transition: opacity 220ms ease, transform 280ms cubic-bezier(.2, .8, .2, 1);
    }
    .configuracion-abierta .fondo-configuracion {
      opacity: 1;
      pointer-events: auto;
    }
    .configuracion-abierta .panel-configuracion {
      opacity: 1;
      pointer-events: auto;
      transform: translateX(0);
    }

    .cabecera-configuracion {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 18px;
    }
    .cabecera-configuracion h1 {
      margin: 0 0 5px;
      font-size: 25px;
      font-weight: 680;
      letter-spacing: -0.025em;
    }
    .cabecera-configuracion p,
    .ayuda-control {
      margin: 0;
      color: rgba(227, 235, 240, 0.63);
      font-size: 13px;
      line-height: 1.45;
    }
    .boton-cerrar,
    .boton-recargar {
      display: grid;
      flex: none;
      place-items: center;
      color: rgba(255, 255, 255, 0.82);
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.1);
      cursor: pointer;
    }
    .boton-cerrar {
      width: 38px;
      height: 38px;
      padding: 0;
      border-radius: 50%;
      font-size: 24px;
      line-height: 1;
    }
    .boton-cerrar:hover,
    .boton-recargar:hover { background: rgba(255, 255, 255, 0.14); }
    .boton-cerrar img {
      width: 18px;
      height: 18px;
    }

    .grupo-configuracion {
      display: grid;
      gap: 12px;
    }
    .titulo-control {
      color: rgba(255, 255, 255, 0.74);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.09em;
      text-transform: uppercase;
    }
    .fila-camara {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 9px;
    }
    select {
      width: 100%;
      min-width: 0;
      height: 46px;
      padding: 0 38px 0 13px;
      color: #fff;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.13);
      border-radius: 12px;
      cursor: pointer;
    }
    select:disabled { cursor: wait; opacity: 0.5; }
    .boton-recargar {
      width: 46px;
      height: 46px;
      padding: 0;
      border-radius: 12px;
      font-size: 21px;
    }
    .boton-recargar img {
      width: 22px;
      height: 22px;
    }

    .lista-ajustes {
      display: grid;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
    }
    .ajuste {
      display: flex;
      min-height: 74px;
      align-items: center;
      justify-content: space-between;
      gap: 22px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      cursor: pointer;
    }
    .ajuste strong {
      display: block;
      margin-bottom: 3px;
      font-size: 15px;
      font-weight: 620;
    }
    .ajuste small {
      display: block;
      color: rgba(227, 235, 240, 0.56);
      font-size: 12px;
      line-height: 1.35;
    }
    .interruptor { position: relative; flex: none; }
    .interruptor input {
      position: absolute;
      width: 1px;
      height: 1px;
      opacity: 0;
    }
    .pista {
      display: block;
      width: 46px;
      height: 26px;
      padding: 3px;
      background: rgba(255, 255, 255, 0.18);
      border-radius: 999px;
      transition: background 180ms ease;
    }
    .pista::after {
      display: block;
      width: 20px;
      height: 20px;
      background: #fff;
      border-radius: 50%;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.34);
      content: "";
      transition: transform 180ms ease;
    }
    .interruptor input:checked + .pista { background: #279bc9; }
    .interruptor input:checked + .pista::after { transform: translateX(20px); }

    .pie-configuracion {
      margin-top: auto;
      padding: 14px 16px;
      color: rgba(227, 235, 240, 0.58);
      background: rgba(255, 255, 255, 0.045);
      border-radius: 14px;
      font-size: 12px;
      line-height: 1.5;
    }

    @media (max-width: 600px) {
      .boton-configuracion { top: 14px; right: 14px; }
      .panel-configuracion {
        top: 0;
        right: 0;
        bottom: 0;
        width: min(420px, 100vw);
        border-radius: 0;
      }
    }
    @media (prefers-reduced-motion: reduce) {
      .boton-configuracion,
      .boton-configuracion img,
      .fondo-configuracion,
      .panel-configuracion,
      .pista,
      .pista::after { transition: none; }
    }
  </style>
</head>
<body>
  <canvas id="lienzo"></canvas>
  <button
    id="abrir-configuracion"
    class="boton-configuracion"
    type="button"
    aria-label="Abrir configuración"
    aria-controls="panel-configuracion"
    aria-expanded="false"
  >
    <img src="/assets/iconos/configuracion.svg" alt="" aria-hidden="true" draggable="false">
  </button>

  <div id="fondo-configuracion" class="fondo-configuracion" aria-hidden="true"></div>
  <aside
    id="panel-configuracion"
    class="panel-configuracion"
    aria-labelledby="titulo-configuracion"
    aria-hidden="true"
    inert
  >
    <header class="cabecera-configuracion">
      <div>
        <h1 id="titulo-configuracion">Configuración</h1>
        <p>Ajustes rápidos del espejo</p>
      </div>
      <button
        id="cerrar-configuracion"
        class="boton-cerrar"
        type="button"
        aria-label="Cerrar configuración"
      >
        <img src="/assets/iconos/cerrar.svg" alt="" aria-hidden="true" draggable="false">
      </button>
    </header>

    <section class="grupo-configuracion" aria-labelledby="titulo-camara">
      <span id="titulo-camara" class="titulo-control">Cámara</span>
      <div class="fila-camara">
        <select id="selector-camara" aria-label="Cámara activa"></select>
        <button
          id="recargar-camaras"
          class="boton-recargar"
          type="button"
          aria-label="Buscar cámaras nuevamente"
          title="Buscar cámaras nuevamente"
        >
          <img src="/assets/iconos/recargar.svg" alt="" aria-hidden="true" draggable="false">
        </button>
      </div>
      <p id="estado-camara-configuracion" class="ayuda-control" aria-live="polite">
        Buscando cámaras...
      </p>
    </section>

    <section class="lista-ajustes" aria-label="Opciones">
      <label class="ajuste">
        <span>
          <strong>Modo demo</strong>
          <small>Simula una persona sin usar la cámara.</small>
        </span>
        <span class="interruptor">
          <input id="modo-demo" type="checkbox">
          <span class="pista" aria-hidden="true"></span>
        </span>
      </label>
      <label class="ajuste">
        <span>
          <strong>Avance manual</strong>
          <small>Usa AVANZAR en la tablet antes de cambiar de escena.</small>
        </span>
        <span class="interruptor">
          <input id="avance-manual" type="checkbox">
          <span class="pista" aria-hidden="true"></span>
        </span>
      </label>
      <label class="ajuste">
        <span>
          <strong>Malla de diagnóstico</strong>
          <small>Muestra los puntos detectados en cara y manos.</small>
        </span>
        <span class="interruptor">
          <input id="mostrar-malla" type="checkbox">
          <span class="pista" aria-hidden="true"></span>
        </span>
      </label>
    </section>

    <div class="pie-configuracion">
      Los atajos de teclado siguen disponibles: <strong>C</strong> cambia de cámara,
      <strong>D</strong> activa demo y <strong>P</strong> abre el diagnóstico.
    </div>
  </aside>
  <script type="module" src="./main.js"></script>
</body>
</html>
