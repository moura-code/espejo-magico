<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Generador de fondos de cada ingeniería</title>
</head>
<body>
  <!-- Pagina sin interfaz: la consume herramientas/generar-fondos.mjs con Chrome
       sin cabeza, leyendo el JSON que queda en el <pre> del final. Tambien se
       puede abrir a mano desde `npm start` para mirar las doce escenas. -->
  <script type="module">
    import { dibujarEscenario, ESCENARIOS } from '../espejo/escenarios.js';
    import { figurasDisponibles } from '../espejo/figuras.js';
    import { cargarContenido, fondoActivo } from '../espejo/contenido.js';

    // El tamaño de la pantalla del stand. El fondo se dibuja cubriendo, asi que
    // generarlo mas chico se notaria: es lo unico de la escena que no tiene
    // detalle propio para disimular el escalado.
    const ANCHO = 1080;
    const ALTO = 1920;

    const salida = { pngs: {}, avisos: [] };
    const contenido = await cargarContenido({ figurasValidas: figurasDisponibles() });

    // Se genera solo el fondo ACTIVO de cada carrera: los otros candidatos son
    // fotografias, y una escena vectorial repetida tres veces no es una opcion.
    for (const carrera of contenido.carreras) {
      const fondo = fondoActivo(carrera);
      if (!fondo) {
        salida.avisos.push(`${carrera.id}: no declara fondos en carreras.json`);
        continue;
      }
      if (!ESCENARIOS[carrera.id]) {
        salida.avisos.push(`${carrera.id}: no tiene escena en espejo/escenarios.js`);
        continue;
      }

      const lienzo = document.createElement('canvas');
      lienzo.width = ANCHO;
      lienzo.height = ALTO;
      const ctx = lienzo.getContext('2d');

      dibujarEscenario(ctx, carrera.id, ANCHO, ALTO, carrera.color);
      salida.pngs[fondo.img] = lienzo.toDataURL('image/png');
    }

    // Las marcas se arman por partes: si aparecieran enteras en este fuente,
    // el volcado del DOM (que incluye el <script>) tendria dos apariciones y
    // la herramienta leeria la del codigo en vez de la salida.
    const pre = document.createElement('pre');
    pre.id = 'salida';
    pre.textContent = '@@' + 'SALIDA@@' + JSON.stringify(salida) + '@@' + 'FIN@@';
    document.body.appendChild(pre);
  </script>
</body>
</html>
